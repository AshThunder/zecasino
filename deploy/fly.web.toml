app = "zecasino"
primary_region = "jnb"
[build]
  dockerfile = "web.Dockerfile"
  [build.args]
    NEXT_PUBLIC_GAME_WS = "wss://zecasino-gs.fly.dev/ws"
    NEXT_PUBLIC_DEMO_WS = "wss://zecasino-demo.fly.dev/ws"
[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
