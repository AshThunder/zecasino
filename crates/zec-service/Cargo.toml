[package]
name = "zecasino-zec-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Zecasino cashier: shielded-only Zcash wallet (NU7 testnet) for deposits and withdrawals"

[dependencies]
anyhow = "1"
axum = "0.8"
bip0039 = { version = "0.14", features = ["std"] }
hex = "0.4"
rand = "0.8"
rand10 = { package = "rand", version = "0.10", default-features = false, features = ["sys_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
zeroize = "1"

# Zcash, NU7 pre-release. Deliberately NO `transparent-inputs` and NO `pczt` (which would force it on):
# the service never derives, watches or queries a transparent address.
zcash_address = "=0.14.0-pre.2"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"] }
orchard = "=0.16.0"
zcash_protocol = "=0.11.0-pre.1"
zip32 = "0.3"
zip321 = "=0.10.0-pre.2"
