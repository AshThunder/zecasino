[package]
name = "zecasino-mental-poker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mental poker for Zecasino: ElGamal-on-Ristretto deck masking, verifiable shuffles, threshold card reveal"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde_json", "getrandom/js"]

[dependencies]
curve25519-dalek = { version = "4", features = ["rand_core", "digest", "serde"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2" }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "1"
wasm-bindgen = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
