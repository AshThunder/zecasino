[package]
name = "zecasino-fairness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Provably fair commit-reveal engine for Zecasino"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
